<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Priyanshu Secure Portal Dashboard"
    >

    <title>Dashboard | Priyanshu Secure Portal</title>

    <link
        rel="stylesheet"
        href="style.css?v=3001"
    >

    <style>
        /* =====================================================
           DASHBOARD
           ===================================================== */

        .dashboard-page {
            min-height: 100vh;
            padding: 28px;
            position: relative;
            overflow-x: hidden;
        }

        .dashboard-container {
            width: min(1180px, 100%);
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            padding: 22px 24px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 24px;
            background: rgba(15, 15, 25, .72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .dashboard-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dashboard-logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 18px;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );
            box-shadow:
                0 10px 30px rgba(76,81,255,.35);
        }

        .dashboard-brand-text h1 {
            margin: 0;
            color: white;
            font-size: 18px;
            letter-spacing: .5px;
        }

        .dashboard-brand-text p {
            margin: 4px 0 0;
            color: rgba(255,255,255,.55);
            font-size: 12px;
        }

        .logout-btn {
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(255,255,255,.06);
            color: white;
            padding: 11px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: .25s ease;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,.12);
            transform: translateY(-2px);
        }

        .welcome-section {
            margin-bottom: 24px;
        }

        .welcome-section h2 {
            margin: 0;
            color: white;
            font-size: clamp(28px, 5vw, 42px);
            line-height: 1.1;
        }

        .welcome-section p {
            margin: 10px 0 0;
            color: rgba(255,255,255,.58);
            font-size: 15px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .dashboard-card {
            position: relative;
            padding: 24px;
            min-height: 170px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,.10);
            background: rgba(15,15,25,.68);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 18px 50px rgba(0,0,0,.18);
            overflow: hidden;
            transition: .3s ease;
        }

        .dashboard-card::before {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            right: -50px;
            top: -50px;
            background: rgba(124,58,237,.16);
            filter: blur(10px);
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,.18);
            box-shadow: 0 25px 70px rgba(0,0,0,.28);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            margin-bottom: 18px;
            background: rgba(124,58,237,.14);
            border: 1px solid rgba(124,58,237,.22);
            color: white;
            font-size: 19px;
        }

        .dashboard-card h3 {
            margin: 0 0 8px;
            color: white;
            font-size: 17px;
        }

        .dashboard-card p {
            margin: 0;
            color: rgba(255,255,255,.52);
            font-size: 13px;
            line-height: 1.6;
        }

        .profile-card {
            grid-column: span 2;
        }

        .profile-info {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .profile-item {
            padding: 14px;
            border-radius: 14px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.07);
        }

        .profile-label {
            display: block;
            color: rgba(255,255,255,.42);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .profile-value {
            display: block;
            color: white;
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        .status-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(34,197,94,.10);
            border: 1px solid rgba(34,197,94,.20);
            color: #86efac;
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74,222,128,.8);
        }

        .security-card {
            grid-column: span 3;
        }

        .security-list {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .security-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.07);
        }

        .security-check {
            width: 28px;
            height: 28px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: rgba(34,197,94,.12);
            color: #86efac;
            font-weight: 900;
        }

        .security-item span:last-child {
            color: rgba(255,255,255,.72);
            font-size: 12px;
        }

        .dashboard-footer {
            text-align: center;
            padding: 28px 0 10px;
            color: rgba(255,255,255,.35);
            font-size: 11px;
        }

        .loading-state {
            text-align: center;
            padding: 100px 20px;
            color: rgba(255,255,255,.6);
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.12);
            border-top-color: white;
            animation: dashboardSpin .8s linear infinite;
        }

        @keyframes dashboardSpin {
            to {
                transform: rotate(360deg);
            }
        }

        .dashboard-error {
            max-width: 500px;
            margin: 100px auto;
            padding: 28px;
            text-align: center;
            border-radius: 22px;
            border: 1px solid rgba(239,68,68,.18);
            background: rgba(15,15,25,.75);
            color: white;
        }

        .dashboard-error p {
            color: rgba(255,255,255,.55);
            line-height: 1.6;
        }

        .back-login-btn {
            border: 0;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(
                135deg,
                #7c3aed,
                #2563eb
            );
        }

        @media (max-width: 850px) {

            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }

            .profile-card {
                grid-column: span 2;
            }

            .security-card {
                grid-column: span 2;
            }

            .security-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {

            .dashboard-page {
                padding: 14px;
            }

            .dashboard-header {
                padding: 16px;
                border-radius: 18px;
            }

            .dashboard-logo {
                width: 44px;
                height: 44px;
            }

            .dashboard-brand-text h1 {
                font-size: 15px;
            }

            .dashboard-brand-text p {
                font-size: 10px;
            }

            .logout-btn {
                padding: 9px 13px;
                font-size: 12px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .profile-card,
            .security-card {
                grid-column: span 1;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }

            .dashboard-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard-page">

        <div class="dashboard-container">

            <!-- HEADER -->
            <header class="dashboard-header">

                <div class="dashboard-brand">

                    <div class="dashboard-logo">
                        PK
                    </div>

                    <div class="dashboard-brand-text">
                        <h1>
                            PRIYANSHU SECURE PORTAL
                        </h1>

                        <p>
                            Secure Authentication Dashboard
                        </p>
                    </div>

                </div>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutBtn"
                >
                    Logout
                </button>

            </header>


            <!-- CONTENT -->
            <section id="dashboardContent">

                <div class="loading-state">

                    <div class="loading-spinner"></div>

                    <div>
                        Loading your secure dashboard...
                    </div>

                </div>

            </section>


            <footer class="dashboard-footer">
                © 2026 Priyanshu Secure Portal
                · Protected Authentication Environment
            </footer>

        </div>

    </main>


    <script>

        "use strict";

        const API_URL =
            "https://priyanshu-secure-auth.onrender.com";

        const TOKEN_KEY =
            "priynashu_access_token";

        const USER_KEY =
            "priynashu_user";

        const dashboardContent =
            document.getElementById(
                "dashboardContent"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );


        /* =====================================================
           API REQUEST
           ===================================================== */

        async function getCurrentUser(token) {

            const response =
                await fetch(
                    `${API_URL}/api/me`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );

            let data = null;

            try {

                data =
                    await response.json();

            } catch {

                data = {
                    success: false
                };

            }

            return {
                response,
                data
            };
        }


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================================
           FORMAT DATE
           ===================================================== */

        function formatDate(dateValue) {

            if (!dateValue) {
                return "Not available";
            }

            const date =
                new Date(dateValue);

            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {
                return "Not available";
            }

            return date.toLocaleString(
                "en-IN",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );
        }


        /* =====================================================
           RENDER DASHBOARD
           ===================================================== */

        function renderDashboard(user) {

            const name =
                escapeHTML(
                    user.name ||
                    "User"
                );

            const email =
                escapeHTML(
                    user.email ||
                    "Not available"
                );

            const userId =
                escapeHTML(
                    user.id ||
                    "Not available"
                );

            const createdAt =
                formatDate(
                    user.created_at
                );

            dashboardContent.innerHTML = `

                <div class="welcome-section">

                    <h2>
                        Welcome back, ${name} 👋
                    </h2>

                    <p>
                        Your account is authenticated
                        and your secure session is active.
                    </p>

                </div>


                <div class="dashboard-grid">

                    <!-- PROFILE -->
                    <article class="dashboard-card profile-card">

                        <div class="card-icon">
                            👤
                        </div>

                        <h3>
                            Account Profile
                        </h3>

                        <p>
                            Your verified account information.
                        </p>

                        <div class="profile-info">

                            <div class="profile-item">

                                <span class="profile-label">
                                    Full Name
                                </span>

                                <span class="profile-value">
                                    ${name}
                                </span>

                            </div>


                            <div class="profile-item">

                                <span class="profile-label">
                                    Email
                                </span>

                                <span class="profile-value">
                                    ${email}
                                </span>

                            </div>


                            <div class="profile-item">

                                <span class="profile-label">
                                    Account ID
                                </span>

                                <span class="profile-value">
                                    #${userId}
                                </span>

                            </div>


                            <div class="profile-item">

                                <span class="profile-label">
                                    Created
                                </span>

                                <span class="profile-value">
                                    ${createdAt}
                                </span>

                            </div>

                        </div>

                    </article>


                    <!-- STATUS -->
                    <article class="dashboard-card status-card">

                        <div>

                            <div class="card-icon">
                                🔐
                            </div>

                            <h3>
                                Security Status
                            </h3>

                            <p>
                                Your current authentication
                                session is valid.
                            </p>

                        </div>

                        <div class="status-badge">

                            <span class="status-dot"></span>

                            Authenticated

                        </div>

                    </article>


                    <!-- AUTHENTICATION -->
                    <article class="dashboard-card">

                        <div class="card-icon">
                            🛡️
                        </div>

                        <h3>
                            Authentication
                        </h3>

                        <p>
                            Your password is securely
                            protected using server-side
                            password hashing.
                        </p>

                    </article>


                    <!-- DATABASE -->
                    <article class="dashboard-card">

                        <div class="card-icon">
                            🗄️
                        </div>

                        <h3>
                            Database
                        </h3>

                        <p>
                            Account data is managed through
                            the secure PostgreSQL backend.
                        </p>

                    </article>


                    <!-- ACTIVITY -->
                    <article class="dashboard-card">

                        <div class="card-icon">
                            📊
                        </div>

                        <h3>
                            Activity Logging
                        </h3>

                        <p>
                            Authentication activity is
                            recorded by the backend for
                            security monitoring.
                        </p>

                    </article>


                    <!-- SECURITY -->
                    <article class="dashboard-card security-card">

                        <div class="card-icon">
                            ⚡
                        </div>

                        <h3>
                            Security Features
                        </h3>

                        <p>
                            Core security protections
                            enabled for this portal.
                        </p>


                        <div class="security-list">

                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    Password Hashing
                                </span>

                            </div>


                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    JWT Authentication
                                </span>

                            </div>


                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    Rate Limiting
                                </span>

                            </div>


                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    Security Headers
                                </span>

                            </div>


                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    PostgreSQL Storage
                                </span>

                            </div>


                            <div class="security-item">

                                <div class="security-check">
                                    ✓
                                </div>

                                <span>
                                    Protected API
                                </span>

                            </div>

                        </div>

                    </article>

                </div>
            `;
        }


        /* =====================================================
           SHOW ERROR
           ===================================================== */

        function showError(message) {

            dashboardContent.innerHTML = `

                <div class="dashboard-error">

                    <h2>
                        Session Expired
                    </h2>

                    <p>
                        ${escapeHTML(message)}
                    </p>

                    <button
                        class="back-login-btn"
                        id="backLoginBtn"
                    >
                        Back to Login
                    </button>

                </div>
            `;

            const backLoginBtn =
                document.getElementById(
                    "backLoginBtn"
                );

            if (backLoginBtn) {

                backLoginBtn.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "index.html";

                    }
                );

            }
        }


        /* =====================================================
           LOAD DASHBOARD
           ===================================================== */

        async function loadDashboard() {

            const token =
                sessionStorage.getItem(
                    TOKEN_KEY
                );

            if (!token) {

                window.location.replace(
                    "index.html"
                );

                return;
            }

            try {

                const {
                    response,
                    data
                } =
                    await getCurrentUser(
                        token
                    );


                if (
                    !response.ok ||
                    !data.success ||
                    !data.user
                ) {

                    sessionStorage.removeItem(
                        TOKEN_KEY
                    );

                    sessionStorage.removeItem(
                        USER_KEY
                    );

                    showError(
                        "Your authentication session is no longer valid. Please sign in again."
                    );

                    return;
                }


                sessionStorage.setItem(
                    USER_KEY,
                    JSON.stringify(
                        data.user
                    )
                );


                renderDashboard(
                    data.user
                );


            } catch (error) {

                console.error(
                    "DASHBOARD ERROR:",
                    error
                );

                showError(
                    "Unable to connect to the authentication server. Please try again."
                );

            }
        }


        /* =====================================================
           LOGOUT
           ===================================================== */

        function logout() {

            sessionStorage.removeItem(
                TOKEN_KEY
            );

            sessionStorage.removeItem(
                USER_KEY
            );

            window.location.replace(
                "index.html"
            );
        }


        if (logoutBtn) {

            logoutBtn.addEventListener(
                "click",
                logout
            );

        }


        /* =====================================================
           START
           ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                loadDashboard();

            }
        );

    </script>

</body>
</html>
