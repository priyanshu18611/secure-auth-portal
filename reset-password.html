<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — Priyanshu Secure Portal</title><link rel="stylesheet" href="style.css"></head><body><main class="login-wrapper"><section class="login-card"><div class="brand">PK</div><h1>Reset Password</h1><p>Set a new password for your Secure Portal account.</p><form id="resetForm"><input id="newPassword" type="password" placeholder="New password" minlength="6" maxlength="128" required><input id="confirmPassword" type="password" placeholder="Confirm password" minlength="6" maxlength="128" required><button type="submit">Update Password</button><div id="resetMessage"></div></form></section></main><script>const API="https://priyanshu-secure-auth.onrender.com";document.getElementById('resetForm').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value,m=document.getElementById('resetMessage');if(p!==c){m.textContent='Passwords do not match.';return}const token=new URLSearchParams(location.search).get('token');if(!token){m.textContent='Reset token is missing.';return}try{const r=await fetch(API+'/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json();if(!r.ok)throw Error(d.message||'Reset failed');m.textContent=d.message||'Password updated. You can log in now.'}catch(x){m.textContent=x.message}});</script></body></html>
