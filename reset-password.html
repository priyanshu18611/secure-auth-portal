<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Priyanshu Secure Portal password"
    >

    <title>Reset Password | Priyanshu Secure Portal</title>

    <link
        rel="stylesheet"
        href="style.css?v=3001"
    >

    <style>
        /* =====================================================
           RESET PASSWORD PAGE
           ===================================================== */

        .reset-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .reset-container {
            width: min(460px, 100%);
            position: relative;
            z-index: 2;
        }

        .reset-card {
            padding: 34px;
            border-radius: 28px;

            border: 1px solid
                rgba(255,255,255,.12);

            background:
                rgba(15,15,25,.76);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,.35);
        }

        .reset-logo {
            width: 58px;
            height: 58px;

            display: grid;
            place-items: center;

            margin: 0 auto 20px;

            border-radius: 18px;

            color: white;

            font-size: 20px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            box-shadow:
                0 15px 40px
                rgba(76,81,255,.35);
        }

        .reset-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .reset-header h1 {
            margin: 0;

            color: white;

            font-size: 28px;
            line-height: 1.2;
        }

        .reset-header p {
            margin: 10px 0 0;

            color:
                rgba(255,255,255,.55);

            font-size: 13px;
            line-height: 1.6;
        }

        .reset-form {
            display: grid;
            gap: 17px;
        }

        .reset-field {
            display: grid;
            gap: 8px;
        }

        .reset-field label {
            color:
                rgba(255,255,255,.72);

            font-size: 12px;
            font-weight: 700;
        }

        .reset-input-wrap {
            position: relative;
        }

        .reset-input {
            width: 100%;

            box-sizing: border-box;

            padding: 14px 15px;

            border-radius: 13px;

            border: 1px solid
                rgba(255,255,255,.10);

            outline: none;

            background:
                rgba(255,255,255,.055);

            color: white;

            font-size: 14px;

            transition: .25s ease;
        }

        .reset-input::placeholder {
            color:
                rgba(255,255,255,.30);
        }

        .reset-input:focus {
            border-color:
                rgba(124,58,237,.65);

            background:
                rgba(255,255,255,.075);

            box-shadow:
                0 0 0 4px
                rgba(124,58,237,.10);
        }

        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color:
                rgba(255,255,255,.55);

            cursor: pointer;

            font-size: 15px;

            padding: 7px;
        }

        .password-toggle:hover {
            color: white;
        }

        .reset-submit {
            width: 100%;

            margin-top: 5px;

            padding: 14px 18px;

            border: 0;

            border-radius: 13px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #2563eb
                );

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 15px 35px
                rgba(76,81,255,.22);

            transition: .25s ease;
        }

        .reset-submit:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 20px 45px
                rgba(76,81,255,.32);
        }

        .reset-submit:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .reset-message {
            display: none;

            padding: 13px 15px;

            border-radius: 12px;

            font-size: 12px;
            line-height: 1.5;
        }

        .reset-message.show {
            display: block;
        }

        .reset-message.success {
            color: #86efac;

            background:
                rgba(34,197,94,.08);

            border: 1px solid
                rgba(34,197,94,.18);
        }

        .reset-message.error {
            color: #fca5a5;

            background:
                rgba(239,68,68,.08);

            border: 1px solid
                rgba(239,68,68,.18);
        }

        .back-login {
            display: block;

            margin-top: 22px;

            text-align: center;

            color:
                rgba(255,255,255,.58);

            font-size: 12px;

            text-decoration: none;

            transition: .2s ease;
        }

        .back-login:hover {
            color: white;
        }

        .reset-security {
            margin-top: 24px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,.08);

            text-align: center;

            color:
                rgba(255,255,255,.35);

            font-size: 10px;
            line-height: 1.6;
        }

        @media (max-width: 500px) {

            .reset-page {
                padding: 14px;
            }

            .reset-card {
                padding: 25px 20px;
                border-radius: 22px;
            }

            .reset-header h1 {
                font-size: 24px;
            }

        }
    </style>
</head>


<body>

    <main class="reset-page">

        <div class="reset-container">

            <section class="reset-card">

                <!-- LOGO -->
                <div class="reset-logo">
                    PK
                </div>


                <!-- HEADER -->
                <header class="reset-header">

                    <h1>
                        Create New Password
                    </h1>

                    <p>
                        Choose a strong new password
                        for your secure account.
                    </p>

                </header>


                <!-- MESSAGE -->
                <div
                    id="resetMessage"
                    class="reset-message"
                    role="alert"
                ></div>


                <!-- FORM -->
                <form
                    id="resetForm"
                    class="reset-form"
                    novalidate
                >

                    <!-- NEW PASSWORD -->
                    <div class="reset-field">

                        <label for="newPassword">
                            New Password
                        </label>

                        <div class="reset-input-wrap">

                            <input
                                type="password"
                                id="newPassword"
                                class="reset-input"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                minlength="6"
                                maxlength="128"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleNewPassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="reset-field">

                        <label for="confirmPassword">
                            Confirm New Password
                        </label>

                        <div class="reset-input-wrap">

                            <input
                                type="password"
                                id="confirmPassword"
                                class="reset-input"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                minlength="6"
                                maxlength="128"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="toggleConfirmPassword"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- SUBMIT -->
                    <button
                        type="submit"
                        class="reset-submit"
                        id="resetSubmit"
                    >
                        Reset Password
                    </button>

                </form>


                <!-- BACK -->
                <a
                    href="index.html"
                    class="back-login"
                >
                    ← Back to Sign In
                </a>


                <!-- SECURITY -->
                <div class="reset-security">

                    🔐 Your password is securely
                    hashed before being stored.

                    <br>

                    Priyanshu Secure Portal · 2026

                </div>

            </section>

        </div>

    </main>


    <script>

        "use strict";


        /* =====================================================
           CONFIG
           ===================================================== */

        const API_URL =
            "https://priyanshu-secure-auth.onrender.com";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const resetForm =
            document.getElementById(
                "resetForm"
            );

        const newPassword =
            document.getElementById(
                "newPassword"
            );

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const resetSubmit =
            document.getElementById(
                "resetSubmit"
            );

        const resetMessage =
            document.getElementById(
                "resetMessage"
            );

        const toggleNewPassword =
            document.getElementById(
                "toggleNewPassword"
            );

        const toggleConfirmPassword =
            document.getElementById(
                "toggleConfirmPassword"
            );


        /* =====================================================
           URL TOKEN
           ===================================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const resetToken =
            urlParams.get("token");


        /* =====================================================
           MESSAGE
           ===================================================== */

        function showMessage(
            message,
            type
        ) {

            if (!resetMessage) {
                return;
            }

            resetMessage.textContent =
                message;

            resetMessage.className =
                `reset-message show ${type}`;

        }


        /* =====================================================
           PASSWORD TOGGLE
           ===================================================== */

        function setupPasswordToggle(
            button,
            input
        ) {

            if (!button || !input) {
                return;
            }

            button.addEventListener(
                "click",
                () => {

                    const visible =
                        input.type ===
                        "text";

                    input.type =
                        visible
                            ? "password"
                            : "text";

                    button.textContent =
                        visible
                            ? "👁"
                            : "🙈";

                    button.setAttribute(
                        "aria-label",
                        visible
                            ? "Show password"
                            : "Hide password"
                    );

                }
            );

        }


        setupPasswordToggle(
            toggleNewPassword,
            newPassword
        );


        setupPasswordToggle(
            toggleConfirmPassword,
            confirmPassword
        );


        /* =====================================================
           VALIDATION
           ===================================================== */

        function validatePassword(
            password
        ) {

            return (
                password.length >= 6 &&
                password.length <= 128
            );

        }


        /* =====================================================
           RESET PASSWORD
           ===================================================== */

        async function resetPassword() {

            if (!resetToken) {

                showMessage(
                    "This password reset link is missing or invalid. Please request a new reset link.",
                    "error"
                );

                if (resetSubmit) {
                    resetSubmit.disabled =
                        true;
                }

                return;
            }


            const password =
                newPassword.value;

            const confirmation =
                confirmPassword.value;


            if (
                !validatePassword(
                    password
                )
            ) {

                showMessage(
                    "Password must contain between 6 and 128 characters.",
                    "error"
                );

                newPassword.focus();

                return;
            }


            if (
                password !==
                confirmation
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                confirmPassword.focus();

                return;
            }


            resetSubmit.disabled =
                true;

            resetSubmit.textContent =
                "Updating Password...";


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/reset-password`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    token:
                                        resetToken,

                                    password:
                                        password
                                })
                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = {
                        success: false,
                        message:
                            "Invalid server response."
                    };

                }


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        data.message ||
                        "Unable to reset your password. The link may have expired.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "Password reset successfully. Redirecting you to sign in...",
                    "success"
                );


                newPassword.value =
                    "";

                confirmPassword.value =
                    "";


                /*
                 * Wait briefly so the user
                 * can see the success message.
                 */

                setTimeout(
                    () => {

                        window.location.replace(
                            "index.html"
                        );

                    },
                    1800
                );


            } catch (error) {

                console.error(
                    "RESET PASSWORD ERROR:",
                    error
                );

                showMessage(
                    "Unable to connect to the authentication server. Please try again.",
                    "error"
                );

            } finally {

                resetSubmit.disabled =
                    false;

                resetSubmit.textContent =
                    "Reset Password";

            }

        }


        /* =====================================================
           FORM SUBMIT
           ===================================================== */

        if (resetForm) {

            resetForm.addEventListener(
                "submit",
                async (event) => {

                    event.preventDefault();

                    await resetPassword();

                }
            );

        }


        /* =====================================================
           INITIAL CHECK
           ===================================================== */

        if (!resetToken) {

            showMessage(
                "Invalid reset link. Please request a new password reset email.",
                "error"
            );

            if (resetSubmit) {
                resetSubmit.disabled =
                    true;
            }

        }

    </script>

</body>

</html>
