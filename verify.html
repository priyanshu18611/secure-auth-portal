<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification • Priyanshu Developer Academy</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,Arial;background:#070b16;color:#eef2ff;display:grid;place-items:center;padding:22px}.box{width:min(720px,100%);background:rgba(18,24,42,.92);border:1px solid #334155;border-radius:26px;padding:34px;box-shadow:0 25px 80px #0008}.brand{font-weight:800;letter-spacing:2px;color:#a78bfa}.sub{color:#94a3b8}.form{display:flex;gap:10px;margin:25px 0}.form input{flex:1;background:#0b1222;border:1px solid #334155;color:white;border-radius:12px;padding:14px;font-size:15px}.btn{border:0;border-radius:12px;padding:14px 18px;background:#7c3aed;color:white;font-weight:800;cursor:pointer}.result{padding:20px;border-radius:18px;background:#0b1222;border:1px solid #334155}.valid{border-color:#22c55e66}.invalid{border-color:#ef444466}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#172033;color:#cbd5e1;font-size:12px}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #1e293b;padding:12px 0}.row:last-child{border:0}.muted{color:#94a3b8}.error{color:#fca5a5}</style></head><body><main class="box"><div class="brand">PRIYANSHU DEVELOPER ACADEMY</div><h1>Certificate Verification</h1><p class="sub">Verify a course certificate using its unique certificate ID.</p><form class="form" id="form"><input id="id" placeholder="Example: PK-PYTHON-ABC123" autocomplete="off" required><button class="btn">Verify</button></form><div id="result" class="result"><span class="muted">Enter a certificate ID to verify.</span></div></main><script>const API="https://priyanshu-secure-auth.onrender.com";const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);if(params.get('id'))$('id').value=params.get('id');$('form').addEventListener('submit',async e=>{e.preventDefault();const id=$('id').value.trim();if(!id)return;$('result').innerHTML='<span class="muted">Checking certificate…</span>';try{const r=await fetch(API+'/api/certificates/verify/'+encodeURIComponent(id));const d=await r.json();if(d.valid){const c=d.certificate;const date=new Date(c.issued_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});$('result').className='result valid';$('result').innerHTML='<span class="pill">✓ VERIFIED CERTIFICATE</span><h2>'+esc(c.name)+'</h2><div class="row"><span class="muted">Course</span><b>'+esc(c.course_key)+'</b></div><div class="row"><span class="muted">Certificate ID</span><b>'+esc(c.certificate_id)+'</b></div><div class="row"><span class="muted">Issued</span><b>'+esc(date)+'</b></div>';}else{$('result').className='result invalid';$('result').innerHTML='<b class="error">✕ Certificate not found</b><p class="muted">Check the certificate ID and try again.</p>'}}catch(err){$('result').innerHTML='<b class="error">Verification service unavailable.</b><p class="muted">Please try again later.</p>'}});function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
