<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Priyanshu Secure Access</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- ================= BACKGROUND ================= -->

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="particles" id="particles"></div>


    <!-- ================= MAIN ================= -->

    <main class="login-wrapper">

        <section class="login-card">

            <div class="card-glow"></div>


            <!-- BRAND -->

            <div class="brand">

                <div class="logo">
                    <span>PK</span>
                </div>

                <div class="brand-name">
                    <strong>PRIYANSHU</strong>
                    <small>SECURE PORTAL</small>
                </div>

            </div>


            <!-- HEADING -->

            <div class="heading">

                <p class="welcome">
                    WELCOME BACK
                </p>

                <h1>
                    Secure
                    <span>Access</span>
                </h1>

                <p class="subtitle">
                    Sign in to continue to your account
                </p>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="password-header">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot password?
                        </a>

                    </div>

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span class="custom-check"></span>

                        <span>
                            Remember me
                        </span>

                    </label>


                    <div class="secure-status">

                        <span class="status-dot"></span>

                        Secure

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >

                    <span class="btn-text">
                        Sign In
                    </span>

                    <span class="btn-arrow">
                        →
                    </span>

                    <span class="loader"></span>

                </button>

            </form>


            <!-- DIVIDER -->

            <div class="divider">
                <span>OR</span>
            </div>


            <!-- SOCIAL LOGIN -->

            <div class="social-login">

                <button
                    type="button"
                    class="social-btn"
                    id="googleLogin"
                >
                    <span>G</span>
                    Continue with Google
                </button>


                <button
                    type="button"
                    class="social-btn"
                    id="githubLogin"
                >
                    <span>◉</span>
                    Continue with GitHub
                </button>

            </div>


            <!-- REGISTER -->

            <div class="register">

                <span>
                    Don't have an account?
                </span>

                <a
                    href="#"
                    id="registerLink"
                >
                    Create account
                </a>

            </div>


            <!-- SECURITY -->

            <div class="security-note">

                <span>🛡️</span>

                <div>

                    <strong>
                        Protected Connection
                    </strong>

                    <small>
                        Your information is securely encrypted.
                    </small>

                </div>

            </div>


            <!-- FOOTER BRAND -->

            <div class="footer-brand">
                © 2026 <strong>Priyanshu Kumar</strong>
            </div>

        </section>

    </main>


    <!-- ================= TOAST ================= -->

    <div
        class="toast"
        id="toast"
    >

        <div class="toast-icon">
            ✓
        </div>

        <div>

            <strong id="toastTitle">
                Success
            </strong>

            <p id="toastMessage">
                Login successful
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
